<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Galeri Gambar</title>
  <style>
    body { font-family: Arial; margin: 20px; }

    .galeri {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .galeri img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Galeri Gambar</h1>
  <div class="galeri">
    <img src="Gambar/gambar1.jpg" alt="Gambar 1">
    <img src="Gambar/gambar2.jpg" alt="Gambar 2">
    <img src="Gambar/gambar3.jpg" alt="Gambar 3">
    <img src="Gambar/gambar4.jpg" alt="Gambar 4">
    <img src="Gambar/gambar5.jpg" alt="Gambar 5">
    <img src="Gambar/gambar6.jpg" alt="Gambar 6">
  </div>
</body>
</html>
