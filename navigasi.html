<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Menu Navigasi</title>
  <style>
    body { font-family: Arial; margin: 0; }

    nav {
      background: #1a56b0;
      padding: 15px 20px;
    }

    nav ul {
      display: flex;
      justify-content: flex-start;
      gap: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#">Beranda</a></li>
      <li><a href="#">Profil</a></li>
      <li><a href="#">Galeri</a></li>

    </ul>
  </nav>
